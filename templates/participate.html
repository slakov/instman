<section class="notice" aria-labelledby="contact-title">
  <h2 id="contact-title">$contact</h2>
  <a class="contact-address" href="$mailto">$email</a>
  <p>$notice</p>
</section>
<div class="worksheet" id="worksheet">
  <label for="scenario">$choose</label>
  <select id="scenario">$options</select>
  <p class="scenario-prompt" id="prompt" aria-live="polite">$first_prompt</p>
  <label for="draft">$draft</label>
  <textarea id="draft" rows="5" aria-describedby="prompt draft-hint" data-required="$empty"></textarea>
  <p id="draft-hint" class="hint">$hint</p>
  <div class="worksheet-actions link-row">
    <a id="compose" class="button navy" href="$mailto" data-mailto="$mailto">$compose</a>
    <button type="button" class="text-link" id="copy-message" hidden>$copy</button>
    <button type="button" class="text-link" id="save-draft" hidden>$save</button>
  </div>
  <p class="hint" id="mail-help">$how</p>
  <p role="status" data-saved="$saved" data-copied="$copied" data-copy-fallback="$copy_fallback"></p>
  <noscript><dl>$prompts</dl><p>$noscript</p></noscript>
</div>
