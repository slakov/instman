title = "Creativity Center"
intro = "The proposed Center for Scientific and Technical Creativity would give people a place to investigate an idea together. It is one way the wider initiative could put its mission into practice."
[[section]]
id = "paths"
title = "Two ways to begin"
items = [["I have an idea", "Bring an observation, a question or an unfinished design. The first conversation would identify a small test. An author can start without a client."], ["We have a challenge", "A school, community or organization can describe a real situation and offer a setting for a test. Agree on access, responsibilities, resources and criteria before starting."]]
links = [["Prepare an idea", "participate/?scenario=idea#worksheet"], ["Frame a challenge", "participate/?scenario=challenge#worksheet"]]
[[section]]
id = "roles"
title = "Who does what?"
items = [["Author", "Helps choose the question, the first test and how the result should be interpreted."], ["Mentor", "Helps select a method, define safe conditions and distinguish an assumption from an observation."], ["Host site", "Explains what can be observed in the setting, who can take part and what limits apply."]]
body = ["A small coordinating team and temporary working groups have been proposed. A workshop, an experiment fund and paid external assignments would each require a separate decision."]
[[section]]
id = "energy"
title = "A possible first program"
body = ["Why might a schoolroom overheat while otherwise similar rooms stay comfortable? A possible energy-efficiency pilot would compare occupancy, temperature and operating schedules. This is a question for a future host site. There are no reported measurements or savings.", "The earlier CEERS v0.2 concept discussed buildings, energy management, autonomy, computing, resources and human working conditions. Whether to take up any of its proposals is open. Healthy aging remains the wider initiative’s first selected applied direction."]
links = [["Read the pilot note", "materials/energy-pilot/"]]
