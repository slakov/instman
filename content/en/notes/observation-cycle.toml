title = "Planning a first observation"
intro = "Six prompts for recording what you expected, what happened and what you would try next."
kind = "Editorial worksheet"
status = "Proposed method"
credit_line = "Site edition · 23 November 2026 · v1.0"
source = "Editorial note for this site, v1.0, 23 November 2026. Based on the practical cycle proposed on 21 November and the v0.3 brief, §4. The worksheet illustrates the concept. Its effectiveness has not been evaluated. Russian original with an English translation."
[[section]]
id = "prepare"
title = "Before acting"
body = ["State. Describe one situation, including when and where it occurs. Goal. Write the question in a way that allows more than one answer. Plan. Choose a small observation, its duration and something you can record consistently."]
[[section]]
id = "review"
title = "After acting"
body = ["Action. Carry out the observation and record the conditions. Check. Compare your expectation with the record and consider another explanation. New state. Write down what has changed in your understanding and what you would try next."]
