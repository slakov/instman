title = "Why does one classroom overheat?"
intro = "A possible comparison of two classrooms shows what a host school and a researcher would need to agree before taking measurements."
kind = "Editorial example · Creativity Center"
status = "Proposed pilot"
credit_line = "Site edition · 23 November 2026 · v1.0"
source = "Editorial note for this site, v1.0, 23 November 2026. Based on the CEERS v0.2 concept and Center proposals of 22 November, summarized in the v0.3 brief, §§7–8. Illustrative scenario. No host, measurements or savings confirmed. Russian original with an English translation."
[[section]]
id = "question"
title = "Start with the room"
body = ["A host school could identify when the room is uncomfortable and select a comparable room. The group would need to agree on a time window, an indicator of comfort and access to information about occupancy, shading and ventilation."]
[[section]]
id = "test"
title = "What would count as a result?"
body = ["The group could compare temperatures and operating schedules in the two rooms. Energy use, financial cost and comfort would each need its own measure. Before any trial, agree on permissions, the comparison period and who will interpret the records."]
