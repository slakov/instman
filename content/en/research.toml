title = "Research and method"
intro = "How have different cultures described the rhythms of a day? IH-01 is a proposed investigation into those accounts and the observations that could help test them."

[[section]]
id = "rhythms"
title = "Four ways to study a day"
items = [["History · partial review", "Who assigned an activity to a particular hour, and in which text? One table associated with Luvsan was reportedly compared with a scan. The source of the table still needs to be established."], ["Mathematics · preliminary model", "The project has identified the Kuramoto equation as a way to model interacting oscillators. It lets the researcher ask when a set of rhythms might synchronize and under what assumptions."], ["Biology · literature map", "The BIO-MAP overview collates ranges for biological rhythms reported in the literature. IH-01 has yet to collect observations from participants."], ["Symbolism · interpretation", "An hour may carry a particular meaning in a cultural tradition. To make a separate claim about the body at that hour, we would need to define a measurable change and look for evidence of it."]]

[[section]]
id = "evidence"
title = "What the project has established"
body = ["In November 2026 the project set out its research question and began a review of sources. One account of time attributed to Philolaus relies on a modern reconstruction. The chain back to the ancient text still needs checking.", "A later account describes a simulation of forty oscillators. The code, initial conditions, frequencies and parameters are unavailable, so reproducing that calculation remains an open task. The ranges in the literature map likewise leave open whether they support a particular historical time window.", "For a calculation you can reproduce, the two-clock example below gives its assumptions and shows when two oscillators can maintain a constant phase difference. It is a separate worked example. Reproducing the forty-oscillator simulation would require its own inputs."]
links = [["Work through the two-clock model", "materials/phase-locking/"]]

[[section]]
id = "observation"
title = "From an old timetable to an observation"
body = ["Suppose a text associates dawn with activity. First establish what its author meant by activity and how the hour was defined. Then choose an observation someone could record consistently, such as the time of their first walk each day.", "A study would need a prediction, a record of light exposure and daily routines, and a result that would count against the prediction. The proposal is at the planning stage. A protocol, recruitment and data collection are still ahead.", "The published study below gives an example of what a testable question looks like. An independent research team tracked sleep timing and the timing of melatonin release before and after a week outdoors."]
links = [["Read the published study on light and sleep", "materials/light-and-sleep/"], ["How to read a historical timetable", "materials/reading-rhythms/"]]

[[section]]
id = "directions"
title = "Other research questions"
items = [["Healthy aging · selected theme", "Which abilities matter most to people as they grow older, and how can changes in those abilities be assessed? Healthy aging is the initiative’s first applied research theme. The next step is to choose a meaningful outcome and review the evidence for it."], ["Human-centered AI · concept", "Could a tool help someone compare different accounts of their situation while leaving the decision in their hands? The META-ORACLE Personal concept would show the basis of each interpretation so a reader can distinguish personal meaning from empirical evidence."]]
