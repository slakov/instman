title = "About the initiative"
intro = "How do we decide what matters to us when our choices also shape the lives of others? The Institute of the Human grew out of a conversation about this question."

[[section]]
id = "origins"
title = "What we eat and whom it affects"
body = ["The conversation began in November 2026 with a question about vegetarianism. When we choose what to eat, what responsibility do we have towards the animals affected? People with different diets can examine the same question together. A first step is to ask which consequences we know about, which we assume, and what evidence could change our minds.", "The three words on the homepage describe that process. Understanding means looking for the basis of a belief. Developing means choosing an action and learning from its consequences. Becoming is the slower work of making that choice part of everyday life."]

[[section]]
id = "perspectives"
title = "Four perspectives on one choice"
items = [["The person", "What do I experience? What can I choose?"], ["Relationships", "Whose life might change because of my decision?"], ["Environment", "Which natural and built conditions shape my options?"], ["Evolution", "How do people and their ways of living together change over time?"]]

[[section]]
id = "levels"
title = "Seven questions about development"
body = ["These questions form a working framework. Try applying them to one decision you have made."]
items = [["State", "What is happening now?"], ["Awareness", "How do I understand the situation?"], ["Meaning", "Which values give it meaning for me?"], ["Will", "What do I intend to do?"], ["Action", "How does that intention become an act?"], ["Value", "What does my action create, and for whom?"], ["Evolution", "What have I learned, and how have I changed?"]]

[[section]]
id = "cycle"
title = "Planning an observation"
body = ["A separate six-step cycle is for practical work. Describe the starting state, set a goal, make a plan, act, check the result and describe the new state. When you check the result, compare what you expected with what you observed. That comparison can help you decide whether to repeat the observation, change the method or set the question aside."]
links = [["Read the observation worksheet", "materials/observation-cycle/"]]

[[section]]
id = "organisation"
title = "Name and current status"
body = ["Institute of the Human is the working name for this research and education initiative. Its permanent name, visual identity, legal form and academic status remain open. Work so far includes research questions, preliminary reviews and proposals for joint projects.", "A cooperative is one proposal for organizing the development team or a wider community. Membership, governance, rights to results and financial arrangements would need to be agreed before it could operate."]
