title = "About the initiative"
intro = "What does it mean to develop as a person while living alongside others? The proposed University / Institute of the Human begins with this question."
[[section]]
id = "origins"
title = "A question about the living world"
body = ["The founding conversation began in November 2026 with an everyday decision about vegetarianism. What responsibilities follow from the way our food choices affect other living beings? People can disagree about what to eat and still investigate that question together.", "Understanding means finding out what a claim rests on. Developing means choosing an action and learning from its consequences. Becoming describes the slower work of carrying that choice into everyday relationships."]
[[section]]
id = "perspectives"
title = "Four perspectives"
items = [["The person", "What do I experience, understand and choose?"], ["Relationships", "How does my choice affect other people and living beings?"], ["Environment", "Which natural and built conditions influence what is possible?"], ["Evolution", "How do people and their ways of living together change over time? Here evolution names a question about change."]]
[[section]]
id = "levels"
title = "Seven questions about development"
body = ["This proposed conceptual framework is open to criticism and revision. Its seven levels name different questions someone might ask about a decision."]
items = [["State", "What is happening now?"], ["Awareness", "How do I perceive the situation?"], ["Meaning", "Which beliefs and values give it meaning?"], ["Will", "What do I intend to choose?"], ["Action", "How does that intention become an act?"], ["Value", "What does the act create, and for whom?"], ["Evolution", "What have I learned and how have I changed?"]]
[[section]]
id = "cycle"
title = "A practical cycle"
body = ["A separate six-step cycle helps plan and review an actual observation. Describe the starting state, set a goal, make a plan, act, check what happened, then describe the new state. At the check, compare what you expected with what you observed. You can repeat, change the method or set the question aside."]
[[section]]
id = "organisation"
title = "What is still being decided"
body = ["The initiative is developing its research materials and proposed ways of working. Its name and academic and legal forms remain open. Programs, facilities and accreditation have yet to be established.", "A cooperative is under discussion both for a development team and for a wider community of shared projects. Membership, governance, rights to results and financial arrangements remain undecided."]
