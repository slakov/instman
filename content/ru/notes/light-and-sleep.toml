title = "Как меняется время сна за неделю на природе?"
intro = "Восемь взрослых неделю жили в привычном режиме, а затем провели неделю в палатках в штате Колорадо. Исследователи проследили, когда участники засыпали и когда у каждого из них начиналась биологическая ночь."
kind = "Внешнее исследование · Полевой эксперимент"
status = "Опубликованная работа"
credit_line = "Кеннет Райт-младший и соавторы · Current Biology · 1 августа 2013 года"
original = ["Открыть оригинал статьи (англ.)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4020279/"]
source = "Entrainment of the Human Circadian Clock to the Natural Light-Dark Cycle. Current Biology, том 23 (2013), с. 1554–1558. Авторы статьи — Kenneth P. Wright Jr. (автор для переписки), Andrew W. McHill, Brian R. Birks, Brandon R. Griffin, Thomas Rusterholz и Evan D. Chinoy. Редакционный разбор для сайта, v1.0, 23 ноября 2026 года, на русском и английском."
[[section]]
id = "method"
title = "Как измеряли начало биологической ночи"
body = ["Обе недели участники носили на запястье прибор, который регистрировал освещённость и движения. Когда лечь спать, каждый решал сам. После каждой недели участники сдавали пробы слюны в лаборатории при тусклом освещении. По пробам определяли время вечернего подъёма уровня мелатонина. Так у исследователей был биологический показатель, который можно сопоставить со временем сна."]
[[section]]
id = "finding"
title = "Два сдвига разной величины"
body = ["После недели в палатках уровень мелатонина начинал расти в среднем примерно на два часа раньше. Время засыпания и пробуждения сдвинулось примерно на 1,2 часа раньше. На рисунке 3 оба сдвига показаны на одной шкале. По одному только дневнику сна часть изменения биологического ритма осталась бы незаметной."]
[[section]]
id = "limits"
title = "Границы сравнения"
body = ["Все восемь человек прошли оба этапа в одном порядке, в июле и на одной широте. В походе одновременно изменились освещение, физическая активность и распорядок дня. Данные показывают сдвиг в этих условиях. Какую долю внесло каждое из изменений, остаётся открытым вопросом."]
[[section]]
id = "sources"
title = "Где проверить результат"
body = ["На рисунке 1 показаны суточные записи одного участника, на рисунке 2 — освещённость в течение двух недель. Для проверки вывода о времени сна и мелатонине откройте рисунок 3. Статья и подписи к рисункам доступны на английском языке."]
links = [["Полный текст и рисунки в PubMed Central", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4020279/"], ["Библиографическая запись в PubMed", "https://pubmed.ncbi.nlm.nih.gov/23910656/"]]
