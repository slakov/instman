title = "Когда часы с разным ходом начинают идти в одном ритме?"
intro = "У одних часов стрелка совершает оборот за 24 часа, у других — за 25. Насколько сильно они должны влиять друг на друга, чтобы угол между стрелками перестал меняться?"
kind = "IH-01 · Математический пример"
status = "Воспроизводимый расчёт"
credit_line = "Расчёт для сайта · 23 ноября 2026 года"
source = "Уравнение модели приведено у Стивена Строгаца в статье «From Kuramoto to Crawford» (2000), формула 3.1. Периоды и значения силы связи выбраны для этого примера."

[[section]]
id = "setup"
title = "Проследим за углом между стрелками"
body = ["За свой собственный период T каждая стрелка совершает полный оборот. Её угловая скорость равна ω = 2π/T радиан в час. В модели Курамото для двух часов к скорости каждой стрелки прибавляется величина (K/2) × sin(угол другой стрелки − её собственный угол). Параметр K задаёт силу связи.", "Обозначим через δ угол быстрой стрелки за вычетом угла медленной. Разность собственных скоростей равна Δω = 2π/24 − 2π/25. Вычитая одно уравнение движения из другого, получаем dδ/dt = Δω − K sin δ. Чтобы угол оставался постоянным, правая часть должна равняться нулю."]

[[section]]
id = "result"
title = "Скорость одна, положения разные"
body = ["Порог связи равен K = Δω, около 0,01047 радиана в час. Ниже порога быстрая стрелка продолжает уходить вперёд. На самом пороге может сохраняться угол 90°. Выше порога возникает устойчивый угол. Если немного сдвинуть одну стрелку, прежний угол постепенно восстановится.", "При силе связи вдвое выше порога sin δ = 1/2. Устойчивый угол равен 30°, то есть одной двенадцатой оборота. Обе стрелки движутся с одинаковой скоростью. Поправки к их скоростям равны по величине и противоположны по знаку, поэтому общий период равен 2/(1/24 + 1/25) = 1200/49 часа, или примерно 24,49 часа."]

[[section]]
id = "reproduce"
title = "Как повторить расчёт"
body = ["Сохраните файл Python и выполните команду python3 phase_locking.py > results.csv. Программа вычислит ответ по формуле для четырёх значений силы связи — 0, ½, 1 и 2 порога. Пустые ячейки в таблице означают, что постоянного угла и общего периода нет. Для нового примера измените периоды в начале программы.", "Здесь по точным формулам разобрана отдельная задача о двух часах. В более раннем описании IH-01 речь шла о сорока осцилляторах, параметры той симуляции недоступны. Числа в этом примере относятся только к двум модельным часам."]
