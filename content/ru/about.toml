title = "Об инициативе"
intro = "Что значит развиваться как человек, когда живёшь рядом с другими? С этого вопроса начинается замысел Университета / Института человека."
[[section]]
id = "origins"
title = "Вопрос о живом мире"
body = ["Отправной точкой в ноябре 2026 года стал разговор о вегетарианстве. Какую ответственность мы несём за влияние наших пищевых привычек на других живых существ? Люди могут по-разному отвечать на вопрос о питании и вместе исследовать его последствия.", "Понимать — разбираться, на чём основано утверждение. Развиваться — выбирать действие и учиться на его последствиях. Становиться — постепенно воплощать этот выбор в повседневной жизни и отношениях."]
[[section]]
id = "perspectives"
title = "Четыре области"
items = [["Человек", "Что я чувствую, понимаю и выбираю?"], ["Отношения", "Как мой выбор отражается на других людях и живых существах?"], ["Среда", "Какие природные и созданные человеком условия определяют мои возможности?"], ["Эволюция", "Как со временем меняются люди и формы их совместной жизни? Эволюция здесь обозначает вопрос об изменении."]]
[[section]]
id = "levels"
title = "Семь вопросов о развитии"
body = ["Эта концептуальная рамка предложена для обсуждения и проверки. Семь уровней помогают поставить разные вопросы об одном решении."]
items = [["Состояние", "Что происходит сейчас?"], ["Восприятие", "Как я понимаю происходящее?"], ["Смысл", "Какие убеждения и ценности придают ему значение?"], ["Воля", "Какой выбор я намерен сделать?"], ["Действие", "Как намерение становится поступком?"], ["Ценность", "Что создаёт этот поступок и для кого?"], ["Изменение", "Чему я научился и как изменился?"]]
[[section]]
id = "cycle"
title = "Практический цикл"
body = ["Для планирования и разбора наблюдения предложен отдельный цикл из шести шагов. Опишите исходное состояние, поставьте цель, составьте план, выполните действие, проверьте результат и опишите новое состояние. При проверке сопоставьте ожидание с тем, что произошло. Затем можно повторить опыт, сменить метод или отложить вопрос."]
[[section]]
id = "organisation"
title = "Какие решения ещё открыты"
body = ["Инициатива находится на стадии подготовки исследовательских материалов и организационных предложений. Имя, академическая и правовая формы обсуждаются. Действующие программы, площадки и аккредитация пока не подтверждены.", "Кооператив обсуждается в двух масштабах — для команды разработчиков и для более широкого сообщества совместных проектов. Членство, управление, права на результаты и экономические условия предстоит определить."]
