title = "Об инициативе"
intro = "Как понять, что для нас важно, если наш выбор меняет и чужую жизнь? С разговора об этом начался замысел Института человека."

[[section]]
id = "origins"
title = "Кого касается наш выбор еды"
body = ["В ноябре 2026 года разговор начался с вопроса о вегетарианстве. Когда мы выбираем, что есть, какую ответственность мы несём перед животными, которых касается этот выбор? Обсуждать это могут люди с разными привычками питания. Для начала можно спросить, какие последствия нам известны, о каких мы только догадываемся и какие сведения могли бы изменить наше мнение.", "Три слова на главной странице описывают этот путь. Понимать — разбираться, на чём основано убеждение. Развиваться — выбирать действие и учиться на его последствиях. Становиться — постепенно воплощать этот выбор в повседневной жизни."]

[[section]]
id = "perspectives"
title = "Четыре взгляда на один выбор"
items = [["Человек", "Что я испытываю? Что могу выбрать?"], ["Отношения", "На чьей жизни может отразиться моё решение?"], ["Среда", "Какие природные и созданные человеком условия определяют мои возможности?"], ["Эволюция", "Как со временем меняются люди и их совместная жизнь?"]]

[[section]]
id = "levels"
title = "Семь вопросов о развитии"
body = ["Это рабочая схема для размышления. Попробуйте применить её к одному из своих решений."]
items = [["Состояние", "Что происходит сейчас?"], ["Восприятие", "Как я понимаю ситуацию?"], ["Смысл", "Какие ценности придают ей значение лично для меня?"], ["Воля", "Что я намерен сделать?"], ["Действие", "Как намерение становится поступком?"], ["Ценность", "Что создаёт мой поступок и для кого?"], ["Изменение", "Чему я научился и как изменился?"]]

[[section]]
id = "cycle"
title = "Как спланировать наблюдение"
body = ["Для практической работы предложен отдельный цикл из шести шагов. Опишите исходное состояние, поставьте цель, составьте план, выполните действие, проверьте результат и опишите новое состояние. При проверке сопоставьте ожидание с тем, что вы наблюдали. Это поможет решить, стоит ли повторить наблюдение, сменить метод или отложить вопрос."]
links = [["Открыть рабочий лист для наблюдений", "materials/observation-cycle/"]]

[[section]]
id = "organisation"
title = "Название и стадия работы"
body = ["«Институт человека» — рабочее название исследовательской и образовательной инициативы. Окончательное название, фирменный стиль, правовая форма и академический статус пока обсуждаются. Уже сформулированы исследовательские вопросы, составлены предварительные обзоры и предложены совместные проекты.", "Один из вариантов организации работы — кооператив для команды разработчиков или более широкого сообщества. Для его создания потребуется согласовать членство, управление, права на результаты и финансовые условия."]
