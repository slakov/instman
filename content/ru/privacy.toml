title = "О сайте и данных"
intro = "Материалы доступны всем. Если вы решите написать в Институт, вы сами выбираете, что сообщить."

[[section]]
id = "reading"
title = "Чтение и выбор языка"
body = ["Страницы, изображения и шрифты загружаются с GitHub Pages. Сайт не использует системы аналитики или рекламные скрипты. Браузер запоминает выбранный язык на вашем устройстве. Ссылка на конкретную языковую версию всегда открывает именно её."]

[[section]]
id = "drafts"
title = "Черновик и электронная почта"
body = ["На странице участия можно составить обращение и скачать копию на своё устройство. Пока вы пишете, текст остаётся в текущей вкладке. Если вы решите отправить письмо, откроется ваше почтовое приложение с черновиком на адрес Института человека. Вы можете отредактировать письмо и решить, отправлять ли его.", "Когда вы отправляете письмо, получатель видит его текст и сведения об отправителе, которые добавляет ваша почтовая служба. Сам сайт не собирает копии обращений."]

[[section]]
id = "hosting"
title = "Хостинг"
body = ["Сайт размещается на GitHub Pages. По информации GitHub, при посещении таких сайтов хостинг записывает IP-адрес посетителя в целях безопасности."]
links = [["Сведения GitHub о сборе данных", "https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages#data-collection"]]

[[section]]
id = "credits"
title = "Иллюстрация и шрифт"
body = ["«Дуб в Уоттоне» — офорт по работе Джейкоба Джорджа Стратта 1823 года из собрания Wellcome Collection (18303i, Public Domain Mark). Шрифт Source Sans 3 компании Adobe загружается с сайта и распространяется по лицензии SIL Open Font License. Для подписи к офорту используется системный шрифт с засечками."]
links = [["Посмотреть оригинал офорта", "https://wellcomecollection.org/works/gcjezqme"], ["Шрифт Source Sans 3", "https://github.com/adobe-fonts/source-sans"]]
