title = "О сайте и данных"
intro = "В этой версии можно свободно читать материалы и составить черновик на своём устройстве."
[[section]]
id = "reading"
title = "Чтение и выбор языка"
body = ["Страницы, изображения и шрифты загружаются с GitHub Pages. На сайте нет систем аналитики и рекламных скриптов. Браузер запоминает выбранный язык на вашем устройстве, чтобы открывать на нём главную. Ссылка на конкретную языковую версию всегда ведёт на указанный язык."]
[[section]]
id = "drafts"
title = "Что происходит с обращением?"
body = ["Введённый текст остаётся на странице. При скачивании на вашем устройстве создаётся текстовый файл. Сайт не получает копию. Регистрации, приёма обращений и загрузки вложений нет. Получатель и порядок будущей переписки пока обсуждаются."]
[[section]]
id = "hosting"
title = "Хостинг"
body = ["Сайт размещается на GitHub Pages. По информации GitHub, при посещении таких сайтов хостинг записывает IP-адрес посетителя в целях безопасности."]
links = [["Сведения GitHub о сборе данных", "https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages#data-collection"]]
