title = "Исследования и метод"
intro = "Как разные культуры описывают ритмы суток и какие части этих описаний можно проверить? IH-01 начинается с вопроса о том, что именно позволяет установить каждый источник."
[[section]]
id = "rhythms"
title = "Одни сутки, четыре способа поставить вопрос"
items = [["История · частичный обзор", "Проследить происхождение временного окна до текста, издания и переводчика. По имеющимся сообщениям, таблицу, связанную с Лувсаном, сверяли со сканом. Её происхождение остаётся открытым."], ["Математика · постановка модели", "Числовое отношение, резонанс и синхронизация описывают разные явления. Уравнение Курамото выписано как возможная модель взаимодействия осцилляторов."], ["Биология · карта литературы", "В BIO-MAP v0.1–v0.2.1 собраны опубликованные диапазоны ритмов. Источником служит литература. Измерения участников в проекте пока отсутствуют."], ["Символика · интерпретация", "Традиция может связывать время с образом или качеством. Смысл этой связи можно изучать в её культурном контексте. Биологическое истолкование потребовало бы самостоятельной проверки."]]
[[section]]
id = "evidence"
title = "Что можно проверить сегодня?"
body = ["В материалах ноября 2026 года зафиксированы исследовательская программа и частичный обзор. Трактовка, приписываемая Филолаю, опирается на современную реконструкцию. Цепочку до античного источника ещё предстоит сверить.", "В более позднем описании упомянута симуляция сорока осцилляторов. Код, начальные условия, частоты и параметры недоступны, поэтому воспроизвести заявленный результат пока не удалось. Остаётся открытым и вопрос о том, подтверждают ли диапазоны из литературной карты какое-либо историческое временное окно."]
[[section]]
id = "observation"
title = "От старинного расписания к наблюдению"
body = ["Возьмём описание, в котором определённый час связан с активностью. Сначала выясним, что автор называл активностью. Затем выберем величину, которую можно записать в дневник, например время засыпания или начало первого периода активности за день.", "Для возможного исследования нужно сформулировать гипотезу, учесть освещение и распорядок дня, заранее определить, какой результат опроверг бы ожидание. Измерения с участием людей предлагались. Согласование протокола, набор участников и сбор данных ещё впереди."]
