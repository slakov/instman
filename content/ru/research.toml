title = "Исследования и метод"
intro = "Как в разных культурах описывали ритмы суток? В проекте IH-01 предстоит разобраться в этих описаниях и выяснить, какие наблюдения помогут их проверить."

[[section]]
id = "rhythms"
title = "Четыре способа изучать сутки"
items = [["История · частичный обзор", "Кто связал определённое занятие с конкретным часом и в каком тексте? По имеющимся сведениям, одну из таблиц, связанных с Лувсаном, сверяли со сканом. Её происхождение ещё предстоит установить."], ["Математика · постановка модели", "Для описания взаимодействующих осцилляторов в проекте предложено уравнение Курамото. С его помощью можно спросить, при каких условиях несколько колебательных процессов могут синхронизироваться."], ["Биология · обзор литературы", "В обзоре BIO-MAP собраны опубликованные данные о диапазонах биологических ритмов. Собственные наблюдения с участием людей в IH-01 ещё не проводились."], ["Символика · интерпретация", "Определённый час может иметь особое значение в культурной традиции. Чтобы сделать отдельный вывод о состоянии организма в этот час, нужно определить измеримый показатель и проверить, меняется ли он."]]

[[section]]
id = "evidence"
title = "Что уже сделано"
body = ["В ноябре 2026 года был поставлен исследовательский вопрос и начат обзор источников. Например, трактовка времени, которую приписывают Филолаю, опирается на современную реконструкцию. Цепочку до античного текста ещё предстоит проверить.", "В более позднем описании упомянут расчёт для сорока осцилляторов. Код, начальные условия, частоты и параметры недоступны, поэтому воспроизведение расчёта остаётся открытой задачей. Неясно и то, подтверждают ли диапазоны из обзора какое-либо из временных окон, указанных в исторических источниках.", "В отдельном разборе модели двух часов приведены исходные предположения. По ним можно проверить, когда два осциллятора сохраняют постоянную разность фаз. Для воспроизведения расчёта с сорока осцилляторами понадобятся его собственные исходные данные."]
links = [["Разобрать модель двух часов", "materials/phase-locking/"]]

[[section]]
id = "observation"
title = "От старинного расписания к наблюдению"
body = ["Предположим, в тексте рассвет связан с активностью. Сначала стоит выяснить, что автор называл активностью и как определял время. Затем можно выбрать показатель, который человек способен записывать каждый день, например время первой прогулки.", "Для исследования нужны проверяемое предположение, сведения об освещении и распорядке дня, а также заранее сформулированный результат, который противоречил бы ожиданию. Пока это замысел. Разработка протокола, набор участников и сбор данных ещё впереди.", "В опубликованной работе ниже можно увидеть пример проверяемого вопроса. Независимая исследовательская группа сопоставила время сна и время выработки мелатонина у участников до и после недели на природе."]
links = [["Открыть исследование о свете и сне", "materials/light-and-sleep/"], ["Как читать историческое расписание", "materials/reading-rhythms/"]]

[[section]]
id = "directions"
title = "Другие исследовательские вопросы"
items = [["Здоровое старение · выбранная тема", "Какие возможности особенно важно сохранять людям с возрастом и как оценивать изменения? Здоровое старение выбрано первой прикладной темой инициативы. Следующий шаг — определить значимый для человека результат и изучить имеющиеся данные."], ["Человекоцентричный ИИ · концепция", "Может ли инструмент помочь человеку сравнить разные объяснения своей ситуации и сохранить самостоятельность выбора? В концепции META-ORACLE Personal предложено показывать основания каждой интерпретации, чтобы человек мог отличить личный смысл от эмпирических данных."]]
