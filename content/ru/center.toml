title = "Центр творчества"
intro = "Центр научно-технического творчества предложен как место, где люди могли бы вместе проверить идею. Это один из способов воплотить общий замысел инициативы."
[[section]]
id = "paths"
title = "Два равноправных входа"
items = [["У меня есть идея", "Автор может принести наблюдение, вопрос или незавершённый замысел. В первом разговоре предстоит выбрать небольшой опыт. Для этого не обязательно иметь заказчика."], ["У нас есть задача", "Школа, сообщество или организация могут описать реальную ситуацию и предложить площадку. Доступ, ответственность, ресурсы и критерии проверки согласуются до начала работы."]]
links = [["Подготовить идею", "participate/?scenario=idea#worksheet"], ["Сформулировать задачу", "participate/?scenario=challenge#worksheet"]]
[[section]]
id = "roles"
title = "Как распределяются роли"
items = [["Автор", "Участвует в выборе вопроса и первого опыта, обсуждает, как понимать результат."], ["Наставник", "Помогает выбрать метод и безопасные условия, отделить предположение от наблюдения."], ["Площадка", "Определяет, что можно наблюдать на месте, кто может участвовать и какие ограничения действуют."]]
body = ["Предложены небольшая постоянная команда координации и временные рабочие группы. Для мастерской, фонда малых опытов и оплачиваемых внешних задач потребуются отдельные решения."]
[[section]]
id = "energy"
title = "Возможная первая программа"
body = ["Почему один школьный кабинет перегревается, когда в соседнем так же устроенном кабинете комфортно? Возможный пилот по энергоэффективности мог бы сопоставить занятость помещений, температуру и режим работы оборудования. Это вопрос для будущей площадки. Данных наблюдений и результатов экономии пока нет.", "В более ранней концепции CEERS v0.2 обсуждались здания, управление энергией, автономность, вычисления, ресурсы и условия деятельности человека. Выбор программы Центра остаётся открытым. Первым прикладным направлением всей инициативы выбрано здоровое старение."]
links = [["Прочитать заметку о пилоте", "materials/energy-pilot/"]]
