[[section]]
id = "energy"
title = "Возможная первая программа"
body = ["Почему в одном кабинете жарко, хотя в соседнем занятия идут в комфортных условиях? Школа могла бы помочь сопоставить занятость помещений, температуру и графики работы оборудования. Прежде чем начать такую работу по энергоэффективности, нужно найти площадку и договориться об измерениях.", "В более ранней концепции энергоэффективности и ресурсной устойчивости (CEERS v0.2) обсуждались также эксплуатация зданий, вычисления и условия труда. Центр мог бы учесть эти идеи при выборе первой программы. Первой прикладной темой всей инициативы выбрано здоровое старение."]
